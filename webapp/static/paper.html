<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>aibm · Paper</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='28' height='28' rx='8' fill='%23ff5c93'/><circle cx='16' cy='16' r='5' fill='%2316201b'/></svg>" />

  <!-- Off Hours fonts: Bricolage Grotesque, Geist, Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"
    rel="stylesheet"
  />

  <!-- marked.js (Markdown renderer) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/prose.css" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 26px;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Top bar ── */
    #top-bar {
      width: 100%;
      border-bottom: 1px solid var(--line);
      padding: var(--space-4) var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
    }

    #top-bar .back-link {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--pink-text);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    #top-bar .back-link:hover { text-decoration-thickness: 2px; }

    #top-bar .site-title {
      font-family: var(--font-display);
      font-size: 24px;
      line-height: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    #paper-container {
      width: min(720px, 100%);
      padding: var(--space-16) var(--space-4) var(--space-24);
    }

    #paper-loading,
    .load-error { color: var(--ink-muted); font-size: 14px; }

    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    @media (max-width: 768px) {
      #top-bar { padding: var(--space-3) var(--space-4); }
      #paper-container { padding-top: var(--space-12); }
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <a class="back-link" href="index.html">← Back to map</a>
    <span class="site-title">aibm</span>
  </div>

  <div id="paper-container">
    <div id="paper-body" class="prose">
      <p id="paper-loading">Loading…</p>
    </div>
  </div>

  <script>
    (async function () {
      const body = document.getElementById("paper-body");
      try {
        const res = await fetch("content/paper.md");
        if (!res.ok) throw new Error(res.statusText);
        const md = await res.text();
        body.innerHTML = marked.parse(md);
      } catch (err) {
        body.innerHTML =
          '<p class="load-error">Failed to load paper content.</p>';
      }
    })();
  </script>
</body>
</html>
